name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package (build + test)
    # macos-26 carries Xcode 26 / Swift 6.3, which ScreenCaptureKit's Sendable
    # annotations require. Xcode 16 cannot build Sources/PeekCapture.
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test --skip-build

  app:
    name: App target
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install xcodegen
        run: brew install xcodegen

      # Peek.xcodeproj is generated, not committed, so CI has to regenerate it.
      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild -scheme Peek -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
